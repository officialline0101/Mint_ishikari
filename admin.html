<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root {
      --brand: #45c4b7;
      --brand-dark: #2a9d91;
      --brand-soft: #e6f7f5;
      --ink: #1f2a2e;
      --muted: #6b7a80;
      --line: #dfe6e8;
      --bg: #f5f8f8;
      --card: #ffffff;
      --cap0: #eceff0;
      --cap1: #d4f1ee;
      --cap2: #9fe0d8;
      --cap3: #5ccabf;
      --warn: #d9534f;
      --sel: #ff9f1c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 150px;
    }
    button { font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }

    /* ログイン */
    .login {
      max-width: 360px;
      margin: 12vh auto 0;
      padding: 0 16px;
      text-align: center;
    }
    .login .store { color: var(--muted); font-size: 14px; }
    .login h1 { font-size: 22px; margin: 4px 0 24px; }
    .login input {
      width: 100%;
      font-size: 24px;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
    }
    .login input:focus { outline: 2px solid var(--brand); border-color: transparent; }
    .error { color: var(--warn); font-size: 14px; min-height: 1.5em; margin: 8px 0; }

    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: bold;
    }
    .btn-primary:active { background: var(--brand-dark); }
    .btn-block { width: 100%; padding: 14px; font-size: 17px; }

    /* ヘッダー・タブ */
    .topbar {
      background: var(--brand);
      color: #fff;
      padding: 12px 16px;
    }
    .topbar .store { font-size: 12px; opacity: 0.85; }
    .topbar h1 { font-size: 19px; margin: 0; }
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      flex: 1;
      border: 0;
      background: none;
      padding: 12px 4px;
      color: var(--muted);
      border-bottom: 3px solid transparent;
    }
    .tabs button.active {
      color: var(--brand-dark);
      border-bottom-color: var(--brand);
      font-weight: bold;
    }

    main { padding: 12px 8px; max-width: 760px; margin: 0 auto; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 4px 10px; }

    .weeknav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
    }
    .weeknav .label { font-weight: bold; text-align: center; flex: 1; font-size: 15px; }
    .weeknav .btn { padding: 8px 10px; font-size: 14px; }

    /* 表 */
    .grid {
      width: 100%;
      border-collapse: separate;
      border-spacing: 3px;
      table-layout: fixed;
    }
    .grid th {
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 1;
      font-size: 12px;
      font-weight: normal;
      padding: 4px 0;
      line-height: 1.25;
    }
    .grid th.day { cursor: pointer; border-radius: 8px; }
    .grid th.day .d { font-size: 13px; font-weight: bold; display: block; }
    .grid th.day.sun .d, .grid th.day.sun .w { color: #d9534f; }
    .grid th.day.sat .d, .grid th.day.sat .w { color: #3a7bd5; }
    .grid th.day.past { opacity: 0.45; cursor: default; }
    .grid th.day.today { background: var(--brand-soft); }
    .grid th .tag {
      display: inline-block;
      font-size: 10px;
      padding: 0 4px;
      border-radius: 4px;
      margin-top: 2px;
      background: var(--sel);
      color: #fff;
    }
    .grid th .tag.biz { background: #8a6fd1; }
    .grid col.timecol { width: 46px; }
    .grid td.time {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
    }
    .cell {
      position: relative;
      height: 44px;
      border-radius: 8px;
      text-align: center;
      vertical-align: middle;
      cursor: pointer;
      user-select: none;
      line-height: 1.1;
    }
    .cell .n { font-size: 17px; font-weight: bold; display: block; }
    .cell .b { font-size: 10px; color: var(--ink); opacity: 0.75; display: block; }
    .cell.cap-0 { background: var(--cap0); color: #a0aaae; }
    .cell.cap-1 { background: var(--cap1); }
    .cell.cap-2 { background: var(--cap2); }
    .cell.cap-3 { background: var(--cap3); color: #fff; }
    .cell.cap-3 .b { color: #fff; }
    .cell.full .b { font-weight: bold; opacity: 1; }
    .cell.over { box-shadow: inset 0 0 0 2px var(--warn); }
    .cell.over .b { color: var(--warn); opacity: 1; font-weight: bold; }
    .cell.custom::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sel);
    }
    .cell.changed { outline: 2px dashed var(--brand-dark); outline-offset: -2px; }
    .cell.selected { box-shadow: inset 0 0 0 3px var(--sel); }
    .cell.disabled { opacity: 0.4; cursor: default; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 12px;
      color: var(--muted);
      margin: 14px 4px 0;
    }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }
    .legend i.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sel); }
    .legend i.over { background: #fff; box-shadow: inset 0 0 0 2px var(--warn); }

    /* 下部のバー */
    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      padding: 0 8px calc(8px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .bar {
      pointer-events: auto;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      padding: 10px 12px;
    }
    .bar .title { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .bar .title b { color: var(--ink); }
    .caps { display: flex; gap: 6px; }
    .caps button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 10px 0;
      font-weight: bold;
      font-size: 15px;
      line-height: 1.2;
    }
    .caps button small { display: block; font-size: 10px; font-weight: normal; }
    .caps .c0 { background: var(--cap0); color: #6b7a80; }
    .caps .c1 { background: var(--cap1); }
    .caps .c2 { background: var(--cap2); }
    .caps .c3 { background: var(--cap3); color: #fff; }
    .bar .row { display: flex; gap: 8px; align-items: center; }
    .bar .row .msg { flex: 1; font-size: 14px; font-weight: bold; }
    .linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 4px; }

    /* シート（日付のメニュー） */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet {
      background: var(--card);
      width: 100%;
      max-width: 520px;
      border-radius: 16px 16px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }
    .sheet h2 { font-size: 17px; margin: 0 0 4px; }
    .sheet p { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .sheet .btn { width: 100%; margin-bottom: 8px; text-align: left; padding: 13px 14px; }
    .sheet .btn.cancel { text-align: center; color: var(--muted); }

    .toast {
      position: fixed;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 30;
      max-width: calc(100% - 32px);
    }
    .toast.error { background: var(--warn); }
    .loading {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.6);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--brand-dark);
    }
  </style>
</head>
<body>
  <!-- ログイン -->
  <div id="loginScreen" class="login">
    <div class="store"><?= storeName ?></div>
    <h1>予約枠の設定</h1>
    <form id="loginForm">
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
      <div id="loginError" class="error"></div>
      <button class="btn btn-primary btn-block" type="submit">ログイン</button>
    </form>
  </div>

  <!-- 設定画面 -->
  <div id="appScreen" hidden>
    <header class="topbar">
      <div class="store"><?= storeName ?></div>
      <h1>予約枠の設定</h1>
    </header>
    <nav class="tabs">
      <button type="button" data-tab="date" class="active">日付ごとの設定</button>
      <button type="button" data-tab="weekly">曜日ごとの基本設定</button>
    </nav>

    <main>
      <section id="tabDate">
        <div class="weeknav">
          <button type="button" class="btn" id="prevWeek">‹ 前の週</button>
          <div class="label" id="weekLabel"></div>
          <button type="button" class="btn" id="nextWeek">次の週 ›</button>
        </div>
        <p class="hint">枠をタップして選び（複数選択できます）、下のボタンで枠数を決めて「保存する」を押してください。日付をタップすると、その日をまとめて変更できます。</p>
        <table class="grid" id="dateGrid"></table>
      </section>

      <section id="tabWeekly" hidden>
        <p class="hint">毎週くり返す基本の枠数です。「日付ごとの設定」で個別に変えた日は、そちらが優先されます。</p>
        <table class="grid" id="weeklyGrid"></table>
      </section>

      <div class="legend">
        <span><i style="background:var(--cap0)"></i>✕ 受付なし</span>
        <span><i style="background:var(--cap1)"></i>1枠</span>
        <span><i style="background:var(--cap2)"></i>2枠</span>
        <span><i style="background:var(--cap3)"></i>3枠</span>
        <span id="legendCustom"><i class="dot"></i>基本設定から変更した枠</span>
        <span id="legendOver"><i class="over"></i>予約が枠数を超えている</span>
      </div>
    </main>
  </div>

  <div class="bottom">
    <div class="bar" id="selectBar" hidden>
      <div class="title"><b id="selectCount">0</b>件を選択中 → 枠数を選んでください</div>
      <div class="caps">
        <button type="button" class="c0" data-cap="0">✕<small>受付なし</small></button>
        <button type="button" class="c1" data-cap="1">1<small>枠</small></button>
        <button type="button" class="c2" data-cap="2">2<small>枠</small></button>
        <button type="button" class="c3" data-cap="3">3<small>枠</small></button>
      </div>
      <div style="text-align:right"><button type="button" class="linkbtn" id="clearSelection">選択を解除</button></div>
    </div>
    <div class="bar" id="saveBar" hidden>
      <div class="row">
        <div class="msg">保存していない変更があります</div>
        <button type="button" class="btn" id="discardBtn">元に戻す</button>
        <button type="button" class="btn btn-primary" id="saveBtn">保存する</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="sheetOverlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 id="sheetTitle"></h2>
      <p id="sheetText"></p>
      <div id="sheetActions"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="loading" id="loading" hidden>読み込み中…</div>

  <script>
    const DOW = ['日', '月', '火', '水', '木', '金', '土'];
    const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0]; // 月曜はじまり

    const state = {
      pin: '',
      tab: 'date',
      today: '',
      weekStart: '',
      saved: null,     // サーバーに保存されている設定 { times, weekly, dates }
      working: null,   // 画面で編集中の設定 { weekly, dates }
      days: [],        // 表示中の週の予約件数など
      selected: new Set()
    };

    // ---------- 共通 ----------
    function callServer(name, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(error))[name](...args);
      });
    }

    function errorText(error) {
      return String((error && error.message) || error).replace(/^Error:\s*/, '');
    }

    let toastTimer = null;
    function showToast(message, isError) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.toggle('error', !!isError);
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, isError ? 5000 : 2500);
    }

    function setLoading(on) {
      document.getElementById('loading').hidden = !on;
    }

    function pad(n) { return String(n).padStart(2, '0'); }
    function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function parseDateStr(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
    function addDays(s, n) { const d = parseDateStr(s); d.setDate(d.getDate() + n); return toDateStr(d); }
    function mondayOf(s) { const d = parseDateStr(s); const diff = (d.getDay() + 6) % 7; d.setDate(d.getDate() - diff); return toDateStr(d); }
    function shortDate(s) { const d = parseDateStr(s); return (d.getMonth() + 1) + '/' + d.getDate(); }

    function setChar(pattern, index, value) {
      return pattern.slice(0, index) + value + pattern.slice(index + 1);
    }

    function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

    function storage(fn) {
      try { return fn(window.sessionStorage); } catch (e) { return null; }
    }

    // ---------- 設定の計算 ----------
    // その日の基本になる枠数（日付ごとの設定がない場合に使われるもの）
    function basePatternFor(day) {
      return day.businessPattern || state.working.weekly[day.dayOfWeek];
    }

    function effectivePatternFor(day) {
      return state.working.dates[day.date] || basePatternFor(day);
    }

    function savedPatternFor(day) {
      return state.saved.dates[day.date] || day.businessPattern || state.saved.weekly[day.dayOfWeek];
    }

    function changedDates() {
      const result = {};
      const all = new Set(Object.keys(state.saved.dates).concat(Object.keys(state.working.dates)));
      all.forEach(dateStr => {
        const before = state.saved.dates[dateStr] || null;
        const after = state.working.dates[dateStr] || null;
        if (before !== after) result[dateStr] = after;
      });
      return result;
    }

    function weeklyChanged() {
      return JSON.stringify(state.saved.weekly) !== JSON.stringify(state.working.weekly);
    }

    function isDirty() {
      return weeklyChanged() || Object.keys(changedDates()).length > 0;
    }

    function setDatePattern(day, pattern) {
      // 基本設定と同じになったら、日付ごとの設定は消しておく（基本設定の変更に追従させるため）
      if (pattern === basePatternFor(day)) {
        delete state.working.dates[day.date];
      } else {
        state.working.dates[day.date] = pattern;
      }
    }

    // ---------- 表の描画 ----------
    function render() {
      document.getElementById('tabDate').hidden = state.tab !== 'date';
      document.getElementById('tabWeekly').hidden = state.tab !== 'weekly';
      document.getElementById('legendOver').hidden = state.tab !== 'date';
      document.getElementById('legendCustom').hidden = state.tab !== 'date';
      document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));

      if (state.tab === 'date') renderDateGrid(); else renderWeeklyGrid();

      document.getElementById('selectBar').hidden = state.selected.size === 0;
      document.getElementById('selectCount').textContent = state.selected.size;
      document.getElementById('saveBar').hidden = !isDirty();
    }

    function capLabel(cap) { return cap === 0 ? '✕' : String(cap); }

    function renderDateGrid() {
      const table = document.getElementById('dateGrid');
      const times = state.saved.times;
      const first = state.days[0], last = state.days[6];
      document.getElementById('weekLabel').textContent =
        shortDate(first.date) + '（' + DOW[first.dayOfWeek] + '）〜 ' + shortDate(last.date) + '（' + DOW[last.dayOfWeek] + '）';

      let html = '<colgroup><col class="timecol">' + '<col>'.repeat(7) + '</colgroup><thead><tr><th></th>';
      state.days.forEach((day, i) => {
        const classes = ['day'];
        if (day.dayOfWeek === 0) classes.push('sun');
        if (day.dayOfWeek === 6) classes.push('sat');
        if (day.date < state.today) classes.push('past');
        if (day.date === state.today) classes.push('today');
        let tag = '';
        if (state.working.dates[day.date]) tag = '<span class="tag">個別</span>';
        else if (day.businessPattern) tag = '<span class="tag biz">営業日</span>';
        html += '<th class="' + classes.join(' ') + '" data-day="' + i + '"><span class="d">' + shortDate(day.date) +
          '</span><span class="w">' + DOW[day.dayOfWeek] + '</span>' + tag + '</th>';
      });
      html += '</tr></thead><tbody>';

      times.forEach((time, t) => {
        html += '<tr><td class="time" data-row="' + t + '">' + time + '</td>';
        state.days.forEach((day, i) => {
          const pattern = effectivePatternFor(day);
          const cap = Number(pattern.charAt(t));
          const booked = day.counts[t];
          const key = 'd|' + i + '|' + t;
          const classes = ['cell', 'cap-' + cap];
          if (day.date < state.today) classes.push('disabled');
          if (state.working.dates[day.date] && cap !== Number(basePatternFor(day).charAt(t))) classes.push('custom');
          if (cap !== Number(savedPatternFor(day).charAt(t))) classes.push('changed');
          if (booked > 0 && booked >= cap) classes.push('full');
          if (booked > cap) classes.push('over');
          if (state.selected.has(key)) classes.push('selected');
          const sub = booked > 0 ? '予約' + booked : '';
          html += '<td class="' + classes.join(' ') + '" data-key="' + key + '"><span class="n">' + capLabel(cap) +
            '</span><span class="b">' + sub + '</span></td>';
        });
        html += '</tr>';
      });
      table.innerHTML = html + '</tbody>';
    }

    function renderWeeklyGrid() {
      const table = document.getElementById('weeklyGrid');
      const times = state.saved.times;
      let html = '<colgroup><col class="timecol">' + '<col>'.repeat(7) + '</colgroup><thead><tr><th></th>';
      WEEK_ORDER.forEach(dow => {
        const cls = 'day' + (dow === 0 ? ' sun' : '') + (dow === 6 ? ' sat' : '');
        html += '<th class="' + cls + '" data-dow="' + dow + '"><span class="d">' + DOW[dow] + '</span></th>';
      });
      html += '</tr></thead><tbody>';
      times.forEach((time, t) => {
        html += '<tr><td class="time" data-row="' + t + '">' + time + '</td>';
        WEEK_ORDER.forEach(dow => {
          const cap = Number(state.working.weekly[dow].charAt(t));
          const key = 'w|' + dow + '|' + t;
          const classes = ['cell', 'cap-' + cap];
          if (cap !== Number(state.saved.weekly[dow].charAt(t))) classes.push('changed');
          if (state.selected.has(key)) classes.push('selected');
          html += '<td class="' + classes.join(' ') + '" data-key="' + key + '"><span class="n">' + capLabel(cap) + '</span></td>';
        });
        html += '</tr>';
      });
      table.innerHTML = html + '</tbody>';
    }

    // ---------- 操作 ----------
    function isEditableKey(key) {
      const parts = key.split('|');
      if (parts[0] === 'w') return true;
      return state.days[Number(parts[1])].date >= state.today;
    }

    function toggleKeys(keys) {
      const editable = keys.filter(isEditableKey);
      if (editable.length === 0) return;
      const allSelected = editable.every(k => state.selected.has(k));
      editable.forEach(k => allSelected ? state.selected.delete(k) : state.selected.add(k));
      render();
    }

    function applyCapacity(cap) {
      state.selected.forEach(key => {
        const parts = key.split('|');
        const t = Number(parts[2]);
        if (parts[0] === 'w') {
          const dow = Number(parts[1]);
          state.working.weekly[dow] = setChar(state.working.weekly[dow], t, cap);
        } else {
          const day = state.days[Number(parts[1])];
          setDatePattern(day, setChar(effectivePatternFor(day), t, cap));
        }
      });
      state.selected.clear();
      render();
    }

    function openSheet(title, text, actions) {
      document.getElementById('sheetTitle').textContent = title;
      document.getElementById('sheetText').textContent = text;
      const box = document.getElementById('sheetActions');
      box.innerHTML = '';
      actions.concat([{ label: 'キャンセル', cancel: true }]).forEach(action => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn' + (action.cancel ? ' cancel' : '');
        b.textContent = action.label;
        b.addEventListener('click', () => {
          document.getElementById('sheetOverlay').hidden = true;
          if (action.run) { action.run(); render(); }
        });
        box.appendChild(b);
      });
      document.getElementById('sheetOverlay').hidden = false;
    }

    function openDayMenu(index) {
      const day = state.days[index];
      if (day.date < state.today) return;
      const label = shortDate(day.date) + '（' + DOW[day.dayOfWeek] + '）';
      const hasCustom = !!state.working.dates[day.date];
      const actions = [
        { label: 'この日の枠をすべて選択する', run: () => {
          state.selected.clear();
          state.saved.times.forEach((_, t) => state.selected.add('d|' + index + '|' + t));
        } },
        { label: 'この日を休みにする（すべて受付なし）', run: () => {
          setDatePattern(day, '0'.repeat(state.saved.times.length));
        } },
        { label: '土曜日の基本設定と同じにする', run: () => {
          setDatePattern(day, state.working.weekly[6]);
        } },
        { label: '平日（月曜日）の基本設定と同じにする', run: () => {
          setDatePattern(day, state.working.weekly[1]);
        } }
      ];
      if (hasCustom) {
        actions.push({ label: '個別の設定をやめて、' + DOW[day.dayOfWeek] + '曜日の基本設定に戻す', run: () => {
          delete state.working.dates[day.date];
        } });
      }
      const text = hasCustom
        ? 'この日は個別に枠数を設定しています。'
        : (day.businessPattern ? 'カレンダーの「営業日」の予定に合わせて受付しています。' : DOW[day.dayOfWeek] + '曜日の基本設定で受付しています。');
      openSheet(label, text, actions);
    }

    function openWeeklyDayMenu(dow) {
      const actions = [
        { label: DOW[dow] + '曜日の枠をすべて選択する', run: () => {
          state.selected.clear();
          state.saved.times.forEach((_, t) => state.selected.add('w|' + dow + '|' + t));
        } }
      ];
      if (dow !== 0) {
        actions.push({ label: DOW[dow] + '曜日を休みにする（すべて受付なし）', run: () => {
          state.working.weekly[dow] = '0'.repeat(state.saved.times.length);
        } });
      }
      WEEK_ORDER.filter(d => d !== dow).forEach(d => {
        actions.push({ label: DOW[d] + '曜日と同じにする', run: () => {
          state.working.weekly[dow] = state.working.weekly[d];
        } });
      });
      openSheet(DOW[dow] + '曜日の基本設定', '毎週の' + DOW[dow] + '曜日に使われる枠数です。', actions);
    }

    // ---------- サーバーとのやりとり ----------
    function loadWeek(weekStart) {
      setLoading(true);
      return callServer('adminGetWeek', state.pin, weekStart).then(result => {
        state.weekStart = weekStart;
        state.today = result.today;
        state.days = result.days;
        const keepEdits = state.working && isDirty();
        state.saved = result.config;
        if (!keepEdits) {
          state.working = { weekly: clone(result.config.weekly), dates: clone(result.config.dates) };
        }
        state.selected.clear();
        render();
      }).catch(error => {
        showToast(errorText(error), true);
      }).finally(() => setLoading(false));
    }

    function save() {
      const changes = { dates: changedDates() };
      if (weeklyChanged()) changes.weekly = state.working.weekly;
      setLoading(true);
      callServer('adminSave', state.pin, changes).then(config => {
        state.saved = config;
        state.working = { weekly: clone(config.weekly), dates: clone(config.dates) };
        state.selected.clear();
        render();
        showToast('保存しました。予約フォームにすぐ反映されます。');
      }).catch(error => {
        showToast('保存できませんでした：' + errorText(error), true);
      }).finally(() => setLoading(false));
    }

    function login(pin) {
      const errorBox = document.getElementById('loginError');
      errorBox.textContent = '';
      setLoading(true);
      callServer('adminLogin', pin).then(() => {
        state.pin = pin;
        storage(s => s.setItem('slotAdminPin', pin));
        document.getElementById('loginScreen').hidden = true;
        document.getElementById('appScreen').hidden = false;
        return loadWeek(mondayOf(toDateStr(new Date())));
      }).catch(error => {
        storage(s => s.removeItem('slotAdminPin'));
        errorBox.textContent = errorText(error);
        setLoading(false);
      });
    }

    // ---------- イベント ----------
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      if (pin) login(pin);
    });

    document.querySelectorAll('.tabs button').forEach(button => {
      button.addEventListener('click', () => {
        state.tab = button.dataset.tab;
        state.selected.clear();
        render();
      });
    });

    document.getElementById('prevWeek').addEventListener('click', () => loadWeek(addDays(state.weekStart, -7)));
    document.getElementById('nextWeek').addEventListener('click', () => loadWeek(addDays(state.weekStart, 7)));

    document.getElementById('dateGrid').addEventListener('click', e => {
      const cell = e.target.closest('[data-key]');
      if (cell) return toggleKeys([cell.dataset.key]);
      const header = e.target.closest('[data-day]');
      if (header) return openDayMenu(Number(header.dataset.day));
      const row = e.target.closest('[data-row]');
      if (row) toggleKeys(state.days.map((_, i) => 'd|' + i + '|' + row.dataset.row));
    });

    document.getElementById('weeklyGrid').addEventListener('click', e => {
      const cell = e.target.closest('[data-key]');
      if (cell) return toggleKeys([cell.dataset.key]);
      const header = e.target.closest('[data-dow]');
      if (header) return openWeeklyDayMenu(Number(header.dataset.dow));
      const row = e.target.closest('[data-row]');
      if (row) toggleKeys(WEEK_ORDER.map(dow => 'w|' + dow + '|' + row.dataset.row));
    });

    document.querySelectorAll('.caps button').forEach(button => {
      button.addEventListener('click', () => applyCapacity(button.dataset.cap));
    });
    document.getElementById('clearSelection').addEventListener('click', () => { state.selected.clear(); render(); });
    document.getElementById('saveBtn').addEventListener('click', save);
    document.getElementById('discardBtn').addEventListener('click', () => {
      state.working = { weekly: clone(state.saved.weekly), dates: clone(state.saved.dates) };
      state.selected.clear();
      render();
    });
    document.getElementById('sheetOverlay').addEventListener('click', e => {
      if (e.target.id === 'sheetOverlay') e.currentTarget.hidden = true;
    });
    window.addEventListener('beforeunload', e => {
      if (state.working && isDirty()) { e.preventDefault(); e.returnValue = ''; }
    });

    // 同じタブで開き直したときはPINを入れ直さなくてよいようにする
    const rememberedPin = storage(s => s.getItem('slotAdminPin'));
    if (rememberedPin) login(rememberedPin);
  </script>
</body>
</html>
